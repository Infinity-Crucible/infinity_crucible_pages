<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">Infinity Crucible</a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/updates' | relative_url }}" {% if page.url contains '/updates' %}class="active"{% endif %}>Updates</a></li>
        <li><a href="{{ '/media' | relative_url }}" {% if page.url == '/media/' %}class="active"{% endif %}>Media</a></li>
      </ul>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} Infinity Crucible</p>
    </div>
  </footer>
</body>
</html>
